name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '是否创建 GitHub Release'
        required: true
        default: true
        type: boolean
      tag_name:
        description: 'Release 标签名，留空则自动生成 dev-<run_number>'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否标记为预发布版本'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  stub:
    name: VM Stub (linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Compile stub
        run: |
          mkdir -p build/stub
          aarch64-linux-gnu-gcc \
            -c -Os -mcmodel=tiny -fno-stack-protector \
            -fno-builtin -nostdlib -march=armv8-a \
            -DVM_INDIRECT_DISPATCH -DVM_FUNC_SPLIT -DVM_TOKEN_ENTRY \
            stub/linux/arm64/vm_interp.c -o build/stub/vm_interp.o

          aarch64-linux-gnu-ld -T stub/linux/arm64/vm_interp.lds \
            -o build/stub/vm_interp.elf build/stub/vm_interp.o

          aarch64-linux-gnu-objcopy -O binary \
            build/stub/vm_interp.elf build/vm_interp_raw.bin

      - name: Generate blob with symbol header
        run: |
          python3 << 'PYEOF'
          import struct, subprocess
          nm = subprocess.check_output(
              ['aarch64-linux-gnu-nm', 'build/stub/vm_interp.elf']
          ).decode()

          def find_sym(name):
              for line in nm.splitlines():
                  parts = line.split()
                  if len(parts) >= 3 and parts[2] == name:
                      return int(parts[0], 16)
              raise ValueError(f'Symbol {name} not found')

          off1 = find_sym('vm_entry')
          off2 = find_sym('vm_entry_token')
          off3 = find_sym('_token_table_va')
          hdr  = struct.pack('<QQQ', off1, off2, off3)
          raw  = open('build/vm_interp_raw.bin', 'rb').read()
          blob = hdr + raw
          open('build/vm_interp.bin', 'wb').write(blob)
          print(f'[+] vm_interp.bin: {len(blob)} bytes')
          print(f'    vm_entry=0x{off1:X}  vm_entry_token=0x{off2:X}  _token_table_va=0x{off3:X}')
          PYEOF

      - name: Upload VM blob
        uses: actions/upload-artifact@v4
        with:
          name: vm-interp-blob
          path: build/vm_interp.bin

  cli:
    name: CLI (${{ matrix.goos }})
    needs: stub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: vm-interp-blob
          path: cmd/vmpacker/

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o vmpacker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/vmpacker/

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}
          path: vmpacker-*

  gui-windows:
    name: GUI (Windows)
    needs: stub
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: vmp-gui/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: vm-interp-blob
          path: vmp-gui/backend/api/

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build GUI + NSIS installer
        working-directory: vmp-gui
        run: wails build -nsis

      - name: Upload Windows GUI
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: vmp-gui/build/bin/*.exe

  gui-linux:
    name: GUI (Linux)
    needs: stub
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: vmp-gui/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: vm-interp-blob
          path: vmp-gui/backend/api/

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build GUI
        working-directory: vmp-gui
        run: wails build

      - name: Upload Linux GUI
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: vmp-gui/build/bin/vmp-gui

  release:
    name: Auto Release
    needs: [stub, cli, gui-windows, gui-linux]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist/
          merge-multiple: true

      - name: Normalize release assets
        run: |
          mkdir -p release
          find dist -maxdepth 3 -type f | sort
          cp dist/vm_interp.bin release/vm_interp.bin
          cp dist/vmpacker-linux-amd64 release/vmpacker-linux-amd64
          cp dist/vmpacker-windows-amd64.exe release/vmpacker-windows-amd64.exe
          if [ -f dist/vmp-gui ]; then cp dist/vmp-gui release/vmp-gui-linux-amd64; fi
          find dist -type f -name '*.exe' ! -name 'vmpacker-windows-amd64.exe' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            prerelease="false"
            name="VMPacker ${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
            prerelease="${{ inputs.prerelease }}"
            name="VMPacker ${tag}"
          else
            tag="dev-${GITHUB_RUN_NUMBER}"
            prerelease="true"
            name="VMPacker ${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
